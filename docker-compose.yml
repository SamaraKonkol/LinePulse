services:
  postgres:
    image: postgres:16-alpine
    container_name: linepulse-postgres
    environment:
      POSTGRES_DB: linepulse
      POSTGRES_USER: linepulse
      POSTGRES_PASSWORD: linepulse
    ports:
      - "5432:5432"
    volumes:
      - linepulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linepulse -d linepulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: linepulse-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/linepulse
      DATABASE_USER: linepulse
      DATABASE_PASSWORD: linepulse
      JWT_SECRET: ${JWT_SECRET:-linepulse-local-docker-secret-change-me-please}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEMO_USERS_ENABLED: "true"
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:-LinePulse123!}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: linepulse-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  linepulse_postgres_data:
