spring:
  application:
    name: linepulse-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/linepulse}
    username: ${DATABASE_USER:linepulse}
    password: ${DATABASE_PASSWORD:linepulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:linepulse-local-development-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
